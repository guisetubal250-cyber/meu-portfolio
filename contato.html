<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | DevScripts</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones modernos para as redes sociais -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
    <header>
        <div class="logo">DevScripts</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="galeria.html">Galeria</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-container">
        <div class="contato-wrapper">
            
            <!-- COLUNA DA ESQUERDA: Informações e Redes Sociais -->
            <div class="contato-info">
                <h1>Vamos criar algo incrível juntos?</h1>
                <p>Dúvidas sobre os roteiros, propostas de projetos ou apenas quer bater um papo sobre programação? Mande uma mensagem!</p>
                
                <div class="info-links">
                    <div class="info-item">
                        <i class="fas fa-envelope"></i>
                        <span>seuemail@exemplo.com</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>Brasil</span>
                    </div>
                </div>

                <div class="redes-sociais">
                    <a href="https://github.com" target="_blank" class="rede-icon"><i class="fab fa-github"></i></a>
                    <a href="#" target="_blank" class="rede-icon"><i class="fab fa-linkedin"></i></a>
                    <a href="#" target="_blank" class="rede-icon"><i class="fab fa-instagram"></i></a>
                </div>
            </div>

            <!-- COLUNA DA DIREITA: O Formulário Moderno -->
            <div class="formulario-box">
                <!-- LEIA COM ATENÇÃO: Substitua o email abaixo pelo seu email real de desenvolvedor -->
                <form action="https://formsubmit.co" method="POST">
                    
                    <!-- Configurações para redirecionar e desativar robôs -->
                    <input type="hidden" name="_next" value="https://github.io">
                    <input type="hidden" name="_captcha" value="false">
                    
                    <!-- ISSO AQUI MUDA O ASSUNTO DO E-MAIL QUE CHEGA PARA VOCÊ -->
                    <input type="hidden" name="_subject" value="🚀 Nova mensagem de contato do seu Portfólio!">

                    <div class="campo">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="name" placeholder="Como quer ser chamado?" required>
                    </div>

                    <div class="campo">
                        <label for="email">Seu Melhor E-mail</label>
                        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                    </div>

                    <div class="campo">
                        <label for="mensagem">Sua Mensagem</label>
                        <textarea id="mensagem" name="message" rows="5" placeholder="Conte-me sobre o seu projeto..." required></textarea>
                    </div>

                    <button type="submit">Enviar Mensagem <i class="fas fa-paper-plane" style="margin-left: 8px;"></i></button>
                </form>
            </div>

        </div>
    </main>
</body>
</html>
