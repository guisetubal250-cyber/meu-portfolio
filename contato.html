<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Gui Setubal</title>
    <style>
        /* Novo Design Estilo Cyber / Escuro */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            margin: 0;
            padding: 0;
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Menu Superior */
        nav {
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            font-weight: bold;
            font-size: 20px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: #94a3b8;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav ul li a:hover {
            color: #38bdf8;
        }

        /* Container do Formulário */
        main {
            max-width: 480px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .form-box {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 30px;
            color: #ffffff;
            text-align: center;
            font-size: 28px;
            letter-spacing: -0.5px;
        }

        .campo-grupo {
            margin-bottom: 24px;
        }

        .campo-grupo label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #94a3b8;
        }

        .campo-grupo input, .campo-grupo textarea {
            width: 100%;
            padding: 14px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .campo-grupo input:focus, .campo-grupo textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .botao-enviar {
            background: linear-gradient(90deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .botao-enviar:hover {
            opacity: 0.9;
        }

        .botao-enviar:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Menu Superior -->
    <nav>
        <div class="logo">Gui Setubal</div>
        <ul>
            <li><a href="index.html">Projetos</a></li>
            <li><a href="contato.html" style="color: #38bdf8; font-weight: bold;">Contato</a></li>
        </ul>
    </nav>

    <!-- Formulário de Envio -->
    <main>
        <div class="form-box">
            <h2>Fale Comigo</h2>
            <form id="formularioContato" onsubmit="processarEnvio(event)">
                <div class="campo-grupo">
                    <label for="txtNome">Nome Completo</label>
                    <input type="text" id="txtNome" required placeholder="Digite seu nome">
                </div>
                
                <div class="campo-grupo">
                    <label for="txtEmail">E-mail</label>
                    <input type="email" id="txtEmail" required placeholder="seuemail@exemplo.com">
                </div>

                <div class="campo-grupo">
                    <label for="txtMensagem">Sua Mensagem</label>
                    <textarea id="txtMensagem" rows="5" required placeholder="Escreva sua mensagem aqui..."></textarea>
                </div>

                <button type="submit" class="botao-enviar">Enviar Mensagem</button>
            </form>
        </div>
    </main>

    <!-- ==================================================== -->
    <!-- CAIXINHA DE ALERTA PERSONALIZADA (ESTA PÁGINA DIZ)  -->
    <!-- ==================================================== -->
    <div id="meuAlertaCustomizado" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 22px; border-radius: 8px; max-width: 320px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.3); font-family: Arial, sans-serif; box-sizing: border-box;">
            <h4 style="margin: 0 0 12px 0; color: #333; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; font-weight: normal;">Esta página diz:</h4>
            <p style="margin: 0 0 24px 0; color: #555; font-size: 14px;">Mensagem enviada!</p>
            <div style="text-align: right;">
                <button onclick="fecharAlerta()" style="background: #0284c7; color: white; border: none; padding: 8px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">OK</button>
            </div>
        </div>
    </div>

    <!-- ==================================================== -->
    <!-- JAVASCRIPT DE CONTROLE                               -->
    <!-- ==================================================== -->
    <script>
        function processarEnvio(event) {
            event.preventDefault(); 
            abrirAlerta();
            document.getElementById("formularioContato").reset();
        }

        function abrirAlerta() {
            document.getElementById("meuAlertaCustomizado").style.display = "flex";
        }

        function fecharAlerta() {
            document.getElementById("meuAlertaCustomizado").style.display = "none";
        }
    </script>

</body>
</html>
