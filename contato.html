<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">DevScripts</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="galeria.html">Galeria</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="formulario-container">
        <h1>Entre em Contato</h1>
        <p>Dúvidas sobre os roteiros ou propostas de projetos? Mande uma mensagem!</p>
        
        <!-- Altere o email abaixo para o seu email real -->
        <form action="https://formsubmit.co" method="POST">
            
            <!-- Redireciona de volta para a sua página de contato após enviar -->
            <input type="hidden" name="_next" value="https://github.io">
            <input type="hidden" name="_captcha" value="false">

            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="name" placeholder="Seu nome completo" required>
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="campo">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="message" rows="5" placeholder="Digite sua mensagem aqui..." required></textarea>
            </div>

            <button type="submit">Enviar Mensagem</button>
        </form>
    </main>
</body>
</html>
