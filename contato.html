<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | DevScripts</title>
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca de ícones modernos para o aviãozinho do botão -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        .contato-container {
            max-width: 550px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        .contato-container h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .contato-container p {
            color: #a0a0a0;
            font-size: 16px;
            margin-bottom: 35px;
        }

        .formulario-card {
            background-color: #0a0a0a;
            border: 1px solid rgba(0, 85, 255, 0.3);
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
            text-align: left;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .campo-grupo label {
            color: #0055ff;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .campo-grupo input,
        .campo-grupo select,
        .campo-grupo textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: #000000 !important;
            border: 1px solid #222222;
            border-radius: 6px;
            color: #ffffff !important;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .campo-grupo input:focus,
        .campo-grupo select:focus,
        .campo-grupo textarea:focus {
            border-color: #0055ff;
            box-shadow: 0 0 8px rgba(0, 85, 255, 0.3);
        }

        /* ==========================================
           BOTÃO DE ENVIAR MELHORADO E MODERNO
           ========================================== */
        .btn-moderno-enviar {
            background-color: #0055ff !important; /* Azul Principal */
            color: #ffffff !important; /* Letra Branca */
            border: none !important;
            width: 100% !important; /* Largura total da caixa */
            padding: 15px !important;
            font-size: 16px !important;
            font-weight: 700 !important;
            text-transform: uppercase !important; /* Letras Maiúsculas */
            letter-spacing: 1px !important; /* Espaço elegante entre letras */
            border-radius: 8px !important; /* Cantos suavizados combinando com o card */
            cursor: pointer !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 10px !important; /* Espaço entre o texto e o ícone */
            box-shadow: 0 4px 15px rgba(0, 85, 255, 0.3) !important; /* Brilho azul embaixo */
            transition: all 0.3s ease !important; /* Animação suave para os efeitos */
            margin-top: 10px;
        }

        /* Efeito ao passar o mouse (Hover) */
        .btn-moderno-enviar:hover {
            background-color: #0044cc !important; /* Azul levemente mais escuro */
            transform: translateY(-2px) !important; /* Botão sobe de leve */
            box-shadow: 0 6px 20px rgba(0, 85, 255, 0.5) !important; /* Brilho aumenta */
        }

        /* Efeito ao clicar no botão (Active) */
        .btn-moderno-enviar:active {
            transform: translateY(1px) !important; /* Botão afunda ao ser clicado */
            box-shadow: 0 3px 10px rgba(0, 85, 255, 0.2) !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">DevScripts</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="galeria.html">Galeria</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="contato-container">
        <h1>Entre em Contato</h1>
        <p>Dúvidas sobre os scripts ou propostas de projetos? Mande uma mensagem!</p>

        <div class="formulario-card">
            <form id="form-oficial-contato" action="https://formsubmit.co" method="POST">
                
                <input type="hidden" name="_captcha" value="false">

                <div class="campo-grupo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="name" placeholder="Digite seu nome completo" required>
                </div>

                <div class="campo-grupo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="campo-grupo">
                    <label for="motivo">Motivo do Contato</label>
                    <select id="motivo" name="reason">
                        <option value="Dúvida sobre Script">Dúvida sobre Script</option>
                        <option value="Proposta de Projeto">Proposta de Projeto</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="mensagem">Sua Mensagem</label>
                    <textarea id="mensagem" name="message" rows="4" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </div>

                <!-- Nova classe aplicada com o ícone do avião de papel -->
                <button type="submit" id="btn-enviar-mensagem" class="btn-moderno-enviar">
                    <span>Enviar Mensagem</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('form-oficial-contato').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const botao = document.getElementById('btn-enviar-mensagem');
            botao.innerHTML = '<span>Enviando...</span> <i class="fas fa-spinner fa-spin"></i>';
            botao.style.pointerEvents = 'none';

            const dados = new FormData(this);

            fetch(this.action, {
                method: 'POST',
                body: dados,
                headers: { 'Accept': 'application/json' }
            })
            .then(resposta => {
                alert('Mensagem enviada!');
                this.reset();
                botao.innerHTML = '<span>Enviar Mensagem</span> <i class="fas fa-paper-plane"></i>';
                botao.style.pointerEvents = 'auto';
            })
            .catch(erro => {
                alert('Mensagem enviada!');
                this.reset();
                botao.innerHTML = '<span>Enviar Mensagem</span> <i class="fas fa-paper-plane"></i>';
                botao.style.pointerEvents = 'auto';
            });
        });
    </script>

</body>
</html>
