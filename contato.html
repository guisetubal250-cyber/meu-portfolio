<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Portfólio Ana</title>
    <!-- Vinculando o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menu Superior Compartilhado -->
    <nav>
        <div class="logo">Ana<span>.</span></div>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="galeria.html">Galeria</a></li>
            <li><a href="contato.html" class="active">Contato</a></li>
        </ul>
    </nav>

    <!-- Formulário Estilizado -->
    <main>
        <span class="sub-tag">Fale Comigo</span>
        <h1>Contato</h1>
        <p class="descricao-pagina">Envie uma mensagem preenchendo os campos abaixo.</p>

        <div class="form-container">
            <form id="formularioContato" onsubmit="processarEnvio(event)">
                <div class="form-group">
                    <label for="txtNome">Nome Completo</label>
                    <input type="text" id="txtNome" required placeholder="Digite seu nome">
                </div>
                
                <div class="form-group">
                    <label for="txtEmail">E-mail</label>
                    <input type="email" id="txtEmail" required placeholder="seuemail@exemplo.com">
                </div>

                <div class="form-group">
                    <label for="txtMensagem">Sua Mensagem</label>
                    <textarea id="txtMensagem" rows="5" required placeholder="Escreva sua mensagem aqui..."></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensagem</button>
            </form>
        </div>
    </main>

    <!-- Controle JavaScript Nativo -->
    <script>
        function processarEnvio(event) {
            event.preventDefault(); 
            
            alert("Mensagem enviada!"); // Alerta nativo clássico do início
            
            document.getElementById("formularioContato").reset(); 
        }
    </script>

</body>
</html>
