<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | DevScripts</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícone moderno de check para o sucesso -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Estrutura Centralizada Elegante */
        .contato-container {
            max-width: 550px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        .contato-container h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .contato-container p {
            color: #a0a0a0;
            font-size: 16px;
            margin-bottom: 35px;
        }

        /* Caixa do Formulário Minimalista */
        .formulario-card {
            background-color: #0a0a0a;
            border: 1px solid rgba(0, 85, 255, 0.3); /* Borda azul sutil */
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
            text-align: left;
            transition: all 0.4s ease;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .campo-grupo label {
            color: #0055ff; /* Rótulo Azul */
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .campo-grupo input,
        .campo-grupo select,
        .campo-grupo textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: #000000 !important;
            border: 1px solid #222222;
            border-radius: 6px;
            color: #ffffff !important;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .campo-grupo input:focus,
        .campo-grupo select:focus,
        .campo-grupo textarea:focus {
            border-color: #0055ff;
            box-shadow: 0 0 8px rgba(0, 85, 255, 0.3);
        }

        /* Animação suave para a caixinha de sucesso */
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- MENU SUPERIOR -->
    <header>
        <div class="logo">DevScripts</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="galeria.html">Galeria</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main class="contato-container">
        <h1>Entre em Contato</h1>
        <p>Dúvidas sobre os scripts ou propostas de projetos? Mande uma mensagem!</p>

        <div class="formulario-card" id="caixa-principal">
            <!-- LEMBRETE: Substitua o e-mail abaixo pelo seu e-mail verdadeiro -->
            <form id="form-contato" action="https://formsubmit.co" method="POST">
                
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_subject" value="🚀 Nova mensagem do seu Portfólio!">

                <div class="campo-grupo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="name" placeholder="Digite seu nome completo" required>
                </div>

                <div class="campo-grupo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="campo-grupo">
                    <label for="motivo">Motivo do Contato</label>
                    <select id="motivo" name="reason">
                        <option value="Dúvida sobre Script">Dúvida sobre Script</option>
                        <option value="Proposta de Projeto">Proposta de Projeto</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="mensagem">Sua Mensagem</label>
                    <textarea id="mensagem" name="message" rows="4" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </div>

                <button type="submit">Enviar Mensagem</button>
            </form>
        </div>
    </main>

    <!-- Script de Envio Silencioso com Mensagem Maravilhosa no Final -->
    <script>
        document.getElementById('form-contato').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const botao = this.querySelector('button[type="submit"]');
            const caixa = document.getElementById('caixa-principal');
            
            botao.innerHTML = 'Enviando...';
            botao.style.pointerEvents = 'none';
            botao.style.opacity = '0.7';

            const dados = new FormData(this);

            fetch(this.action, {
                method: 'POST',
                body: dados,
                headers: { 'Accept': 'application/json' }
            })
            .then(resposta => {
                if (resposta.ok) {
                    // Substitui o formulário por uma caixinha maravilhosa de sucesso
                    caixa.style.animation = 'aparecer 0.5s ease forwards';
                    caixa.style.borderColor = '#0055ff';
                    caixa.innerHTML = `
                        <div style="text-align: center; padding: 20px 0;">
                            <div style="font-size: 50px; color: #0055ff; margin-bottom: 15px;">
                                <i class="fas fa-envelope-circle-check"></i>
                            </div>
                            <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #ffffff;">
                                Mensagem Enviada!
                            </h2>
                            <p style="color: #a0a0a0; font-size: 14px; line-height: 1.5; margin: 0;">
                                O envio foi concluído com sucesso. Eu, o criador do projeto, já fui notificado no meu e-mail e responderei em breve!
                            </p>
                        </div>
                    `;
                } else {
                    alert('Erro ao enviar. Por favor, tente novamente.');
                    botao.innerHTML = 'Enviar Mensagem';
                    botao.style.pointerEvents = 'auto';
                    botao.style.opacity = '1';
                }
            })
            .catch(erro => {
                alert('Erro na conexão com o servidor.');
                botao.innerHTML = 'Enviar Mensagem';
                botao.style.pointerEvents = 'auto';
                botao.style.opacity = '1';
            });
        });
    </script>
</body>
</html>
