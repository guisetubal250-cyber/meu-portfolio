<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | DevScripts</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contato-container {
            max-width: 550px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        .contato-container h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .contato-container p {
            color: #a0a0a0;
            font-size: 16px;
            margin-bottom: 35px;
        }

        .formulario-card {
            background-color: #0a0a0a;
            border: 1px solid rgba(0, 85, 255, 0.3);
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
            text-align: left;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .campo-grupo label {
            color: #0055ff;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .campo-grupo input,
        .campo-grupo select,
        .campo-grupo textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: #000000 !important;
            border: 1px solid #222222;
            border-radius: 6px;
            color: #ffffff !important;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .campo-grupo input:focus,
        .campo-grupo select:focus,
        .campo-grupo textarea:focus {
            border-color: #0055ff;
            box-shadow: 0 0 8px rgba(0, 85, 255, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">DevScripts</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="galeria.html">Galeria</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="contato-container">
        <h1>Entre em Contato</h1>
        <p>Dúvidas sobre os scripts ou propostas de projetos? Mande uma mensagem!</p>

        <div class="formulario-card">
            <!-- Trava de segurança no id para o JavaScript encontrar o formulário de qualquer jeito -->
            <form id="form-oficial-contato" action="https://formsubmit.co" method="POST">
                
                <div class="campo-grupo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="name" placeholder="Digite seu nome completo" required>
                </div>

                <div class="campo-grupo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="campo-grupo">
                    <label for="motivo">Motivo do Contato</label>
                    <select id="motivo" name="reason">
                        <option value="Dúvida sobre Script">Dúvida sobre Script</option>
                        <option value="Proposta de Projeto">Proposta de Projeto</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="mensagem">Sua Mensagem</label>
                    <textarea id="mensagem" name="message" rows="4" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </div>

                <button type="submit">Enviar Mensagem</button>
            </form>
        </div>
    </main>

    <!-- SCRIPT FORÇADO DE ALERTA -->
    <script>
        document.getElementById('form-oficial-contato').addEventListener('submit', function() {
            alert('Mensagem enviada!');
        });
    </script>

</body>
</html>
