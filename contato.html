<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">DevScripts</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="galeria.html">Galeria</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container">
        <h1>Entre em Contato</h1>
        <p>Dúvidas sobre os scripts ou propostas de projetos? Mande uma mensagem!</p>

        <form action="#" method="POST">
            <div class="campo">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
            </div>

            <div class="campo">
                <label for="motivo">Motivo do Contato:</label>
                <select id="motivo" name="motivo">
                    <option value="duvida">Dúvida sobre Script</option>
                    <option value="parceria">Proposta de Projeto</option>
                    <option value="outros">Outros</option>
                </select>
            </div>

            <div class="campo">
                <label for="mensagem">Sua Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="6" required placeholder="Escreva aqui sua mensagem..."></textarea>
            </div>

            <button type="submit" class="btn">Enviar Mensagem</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 guisetubal250-cyber. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
